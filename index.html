<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#00ffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cron - The Process Wars</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>

<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay">
            <!-- Stats removed, replaced by Profile UI -->
            <div id="profile-btn-container" style="pointer-events: auto;">
                <div id="profile-btn">
                    <span class="icon">USER</span>
                </div>
            </div>
            <div id="zone-name">/tmp/</div>
        </div>
        <div id="message-box"></div>
        <div id="profile-view" class="hidden">
            <div class="profile-header">
                <h2>PLAYER PROFILE</h2>
                <button id="close-profile">X</button>
            </div>
            <div class="profile-content">
                <div class="stat-row">
                    <span class="label">ROM (Health)</span>
                    <span class="value" id="profile-health">100/100</span>
                </div>
                <div class="stat-row">
                    <span class="label">RAM (Stamina)</span>
                    <span class="value" id="profile-stamina">100/100</span>
                </div>
                <div class="stat-row">
                    <span class="label">PID (XP)</span>
                    <span class="value" id="profile-xp">0</span>
                </div>
                <div class="stat-row">
                    <span class="label">Bits</span>
                    <span class="value" id="profile-bits">0</span>
                </div>
                <div class="stat-row">
                    <span class="label">Bytes</span>
                    <span class="value" id="profile-bytes">0</span>
                </div>
                <div class="skill-tree-section">
                    <h3>$PATH (SKILL TREE)</h3>
                    <div id="profile-skills-placeholder">[Skills Placeholder]</div>
                </div>
            </div>
        </div>
    </div>
    <script src="game.js?v=6"></script>
    <script>
        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>

</html>
