<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#00ffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cron - The Process Wars</title>
    <link rel="stylesheet" href="style.css?v=28">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>

<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay">
            <!-- Stats removed, replaced by Profile UI -->
            <div id="profile-btn-container" style="pointer-events: auto;">
                <div id="profile-btn">
                    <!-- Simple User Icon SVG -->
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" class="icon">
                        <path
                            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                    </svg>
                </div>
            </div>
            <div id="zone-name">/tmp/</div>
        </div>
        <div id="message-box"></div>
        <div id="intro-overlay" class="hidden">
            <div id="intro-dialog">
                <div id="kernel-avatar">
                    <svg viewBox="0 0 24 24" width="64" height="64" fill="var(--green)">
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z" />
                    </svg>
                </div>
                <div id="intro-text"></div>
                <div id="intro-controls">
                    <button id="skip-intro" class="ui-btn secondary">SKIP</button>
                    <button id="next-intro" class="ui-btn primary">NEXT >></button>
                </div>
            </div>
        </div>

        <div id="profile-view" class="hidden">
            <div class="profile-header">
                <h2>SHELL</h2>
                <button id="close-profile">X</button>
            </div>
            <div class="profile-content">
                <div class="stat-row">
                    <span class="label" style="color:var(--magenta)">ROM (Health)</span>
                    <span class="value" id="profile-health">100/100</span>
                </div>
                <div class="stat-row">
                    <span class="label" style="color:var(--cyan)">RAM (Stamina)</span>
                    <span class="value" id="profile-stamina">100/100</span>
                </div>
                <div class="stat-row" style="margin-top: 10px; border-top: 1px dashed var(--cyan-dim);"></div>
                <div class="stat-row">
                    <span class="label">Bits</span>
                    <span class="value" id="profile-bits">0</span>
                </div>
                <div class="stat-row">
                    <span class="label">Bytes</span>
                    <span class="value" id="profile-bytes">0</span>
                </div>
                <div class="skill-tree-section">
                    <h3>$PATH (Commands)</h3>
                    <div id="profile-commands">No commands yet.</div>
                </div>
            </div>
        </div>

        <div id="dialogue-overlay" class="hidden">
            <div id="dialogue-box">
                <div id="dialogue-speaker"></div>
                <div id="dialogue-text"></div>
                <button id="dialogue-next" class="ui-btn primary">NEXT >></button>
            </div>
        </div>
    </div>
    <script src="game.js?v=28"></script>
    <script>
        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>

</html>
