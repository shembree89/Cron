<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#00ffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cron - The Process Wars</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>

<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay">
            <div id="stats">
                <div class="stat">
                    <span class="stat-label">ROM</span>
                    <div class="stat-bar">
                        <div id="health-bar" class="stat-fill health"></div>
                    </div>
                </div>
                <div class="stat">
                    <span class="stat-label">RAM</span>
                    <div class="stat-bar">
                        <div id="stamina-bar" class="stat-fill stamina"></div>
                    </div>
                </div>
                <div class="stat">
                    <span class="stat-label">PID</span>
                    <span id="xp-counter">0</span>
                </div>
            </div>
            <div id="zone-name">/tmp/</div>
        </div>
        <div id="message-box"></div>
    </div>
    <script src="game.js?v=5"></script>
    <script>
        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>

</html>
